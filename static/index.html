     <b>When a sample ends</b>Continuous plays on down the set. Single plays the cell you pressed
     and stops.
     <b>Check for updates</b>Compares what is installed against the installer at the head of the
     repository — the same file the update runs, so the two cannot disagree about what newest
     means. It reports and does not act: a button here that replaced the server would be replacing
     the process serving the page that holds the button. Press <b>u</b> in the terminal panel,
     which fetches, checks everything before touching anything, installs, and restarts as the new
     version.
     <b>Cache</b>Catalogues are fetched once and kept for a month; a voice list is seven round
     trips to receive something that changes a few times a year. Every generated sound is kept
     too, filed under the voice, the words and the direction — so going back to a voice you have
     already heard costs nothing and waits for nothing. Update the catalogues when a provider adds
     voices. Clearing the sounds keeps the catalogues, because they are the stable half.
          <b>Import keys from a file</b>Pick the note you already have. The app parses it and writes
     the file itself — you are never asked to create one or get its shape right. Keys are found by
     SHAPE, so account names, dates, the word CANCELLED and pasted URLs are all fine and are never
     mistaken for credentials; the line above each key is kept as its label. Importing the same
     note twice adds nothing and says so. AssemblyAI transcribes and is required; Speechify and
     Hume are the two engines and either is enough. Keys are never displayed anywhere.`);
}
window.settings = settings;
/*
  THE APP OWNS THE KEY FILE.

  Settings used to print the path and leave Baba to create the file, paste into it and get its
  shape right — which is asking somebody who dictates rather than types to do the parser's job by
  hand. He picks the note he already has; this reads it, sorts every provider out of it, and
  appends what is genuinely new.

  IMPORTING THE SAME NOTE TWICE CHANGES NOTHING AND SAYS SO. Silently appearing to work is the
  failure that looks identical to success and sends somebody looking for a bug in the ring.
*/
async function refreshCatalogues(){
  // A month is a guess and this is the escape from it. Both engines, because whichever one was
  // being looked at is not necessarily the one that changed.
  for (const e of ["speechify", "hume"]){
    S.refreshCat = true;
    const d = await busy("re-fetching the " + e + " catalogue…", async () =>
      (await fetch("/api/voices/" + e + "?refresh=1")).json());
    stage(e + ": " + ((d.voices || []).length) + " voices");
  }
  S.refreshCat = false;
  settings();
}
window.refreshCatalogues = refreshCatalogues;

async function clearCache(){
  const d = await busy("clearing…", async () =>
    (await fetch("/api/cache/clear", {method:"POST"})).json());
  stage("removed " + d.removed + " cached sounds");
  settings();
}
window.clearCache = clearCache;

/*
  THESE TWO ARE NOT WRAPPED, ON PURPOSE.

  showCache and the key list read files off the local disk and answer in a millisecond. A spinner
  that appears for one frame is noise, and announcing work that is not happening is the same lie
  the spinner exists to prevent, told in the other direction.
*/
/*
  WHAT IS INSTALLED AND WHAT IS PUBLISHED.

  IT REPORTS AND DOES NOT ACT, and that is the whole design. A button here that updated the app
  would replace the server underneath the page displaying the button — the page would be talking
  to a process that had already been killed, and whatever it said next would be a guess.

  Updating is `u` in the terminal panel, because the process that has to be replaced is the one
  being looked at there. So this says what it found and where to press.
*/
async function checkVersion(){
  const el = $("#versionstate");
  const d = await busy("asking GitHub…", async () =>
    (await fetch("/api/version")).json());
  if (!el) return;
  if (d.why){
    el.textContent = d.installed + " installed — " + d.why;
    return stage(d.why);
  }
  if (d.behind){
    el.innerHTML = `<span style="color:var(--amber)">${d.installed} installed, ${d.latest}
      published — press <b>u</b> in the terminal to update and restart</span>`;
    stage(d.latest + " is out");
  } else {
    el.textContent = d.installed + " installed — this is the newest";
    stage("up to date");
  }
}
window.checkVersion = checkVersion;

async function showCache(){
  const c = await (await fetch("/api/cache")).json();
  const el = $("#cachestate");
  if (!el) return;
  const ages = Object.entries(c.catalogues)
    .map(([k, v]) => k + ": " + (v === null ? "not fetched" : v + " days old"));
  el.textContent = c.files + " cached sounds, " + c.mb + " MB   ·   " + ages.join("   ·   ");
}

async function importKeys(){
  const f = document.createElement("input");
  f.type = "file"; f.accept = "text/*,.txt,.md,.csv";
  f.onchange = async () => {
    const text = await f.files[0].text();
    const d = await busy("parsing and merging the keys…", async () =>
      (await fetch("/api/keys/import", {method:"POST",
        headers:{"Content-Type":"application/json"}, body: JSON.stringify({text})})).json());
    stage(d.why || (d.ok ? "imported" : "nothing imported"));
    settings();
  };
  f.click();
}
window.importKeys = importKeys;

const setCount = n => { S.count = Math.max(1, Math.min(300, S.count+n)); localStorage.count = S.count; refresh().then(settings); };
const setPages = n => { S.pages = Math.max(1, Math.min(S.count, S.pages+n)); localStorage.pages = S.pages; settings(); draw(); };
const setBuckets = n => { S.buckets = n; localStorage.buckets = n; refresh().then(settings); };
const setPlayMode = m => { S.playMode = m; localStorage.playMode = m; settings(); };
Object.assign(window, {setCount, setPages, setBuckets, setPlayMode});

/* ────────────────────────────────────────────────────────────── hotkeys ── */
/*
  WHAT THE OVERLAY TRIANGLE DID ON THE PHONE, THE KEYBOARD DOES HERE. The triangle exists
  because a phone shows one app at a time; a Mac shows the script and this window side by side.
  Space is the same gesture: stop this cell, start the next.
*/
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === " "){ e.preventDefault(); nextCell(); }
  if (e.key === "Escape"){ stopAudio(); if (S.recording !== null) stopRecording(); closeScreen(); }
  if (e.key === "m"){ stopAudio(); S.mode = S.mode === "play" ? "rec" : "play"; draw(); }
  // i and o belong to the cell page and are ignored everywhere else, so they cannot mark a point
  // on a cell nobody is looking at.
  if (ed && $("#screen").className === "on"){
    if (e.key === "i"){ e.preventDefault(); mark(true); }
    if (e.key === "o"){ e.preventDefault(); mark(false); }
  }
  if (e.key === "ArrowRight"){ S.page = Math.min(layout().pageCount-1, S.page+1); draw(); }
  if (e.key === "ArrowLeft"){ S.page = Math.max(0, S.page-1); draw(); }
});

async function nextCell(){
  if (S.recording === null){
    const first = S.cells.findIndex(c => !c.hasAudio);
    if (first >= 0) startRecording(first);
    return;
  }
  const i = S.recording;
  await stopRecording();
  // IT DOES NOT WRAP. Wrapping would overwrite cell 1 while nobody is looking at the grid.
  if (i + 1 < S.count) startRecording(i + 1);
  else stage("cell " + S.count + " is the last one");
}

/* ───────────────────────────────────────────────────────────────── boot ── */
async function refresh(){
  const r = await fetch(`/api/state?project=${S.project}&cells=${S.count}&buckets=${S.buckets}`);
  S.cells = (await r.json()).cells;
  draw();
}
S.count = +(localStorage.count || 30);
S.pages = +(localStorage.pages || 1);
S.buckets = +(localStorage.buckets || 256);
S.playMode = localStorage.playMode || "continuous";
addEventListener("resize", draw);
refresh();
</script>
</body>
</html>
